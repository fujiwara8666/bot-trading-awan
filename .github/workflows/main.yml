name: Jalankan Bot Trading Bosq

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode dari GitHub
      uses: actions/checkout@v4

    - name: Siapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Pasang Bumbu Instan
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Terbangkan Bot Meronda
      run: python main.py
