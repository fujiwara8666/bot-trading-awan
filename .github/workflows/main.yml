name: Ronda Otomatis Setiap 15 Menit

on:
  schedule:
    # Mantra rahasia: Memerintahkan GitHub bangun otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Tombol manual tetap ada buat jaga-jaga

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode dari GitHub
      uses: actions/checkout@v4

    - name: Siapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Pasang Bumbu Instan
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Pengecekan Pasar
      run: python main.py
